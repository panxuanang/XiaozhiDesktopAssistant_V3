name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Tests
        run: pytest -q
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean XiaozhiDesktopAssistant.spec
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\XiaozhiAssistant.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: XiaozhiDesktopAssistant-Windows
          path: |
            dist/XiaozhiDesktopAssistant.exe
            dist/installer/*.exe
